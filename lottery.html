<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#dfff68">
  <title>報告順序抽籤所</title>
  <style>
    :root {
      --ink: #151711;
      --paper: #f4f1e8;
      --acid: #dfff68;
      --lavender: #b9adff;
      --coral: #ff826f;
      --muted: #686b63;
      --line: rgba(21, 23, 17, .18);
      --white: #fffdf7;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(185, 173, 255, .48), transparent 25rem),
        radial-gradient(circle at 92% 88%, rgba(223, 255, 104, .5), transparent 27rem),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.5;
    }

    button { font: inherit; }

    .page-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: .9rem;
      font-weight: 850;
      letter-spacing: .08em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--acid);
    }

    .brand-mark svg { width: 18px; height: 18px; }

    .student-count {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 750;
    }

    .student-count::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4f9845;
      box-shadow: 0 0 0 4px rgba(79, 152, 69, .13);
      content: "";
    }

    main { padding-top: clamp(36px, 6vw, 78px); }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 16px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 850;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 32px;
      height: 2px;
      background: currentColor;
      content: "";
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(340px, .92fr);
      gap: clamp(32px, 6vw, 88px);
      align-items: end;
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(3.3rem, 8.3vw, 7.7rem);
      font-weight: 900;
      line-height: .88;
      letter-spacing: -.072em;
    }

    h1 .highlight {
      position: relative;
      z-index: 0;
      display: inline-block;
      margin-left: .04em;
    }

    h1 .highlight::after {
      position: absolute;
      z-index: -1;
      right: -.07em;
      bottom: .05em;
      left: -.04em;
      height: .28em;
      border-radius: 2px;
      background: var(--acid);
      transform: rotate(-1.8deg);
      content: "";
    }

    .intro {
      max-width: 470px;
      margin: 0 0 32px;
      color: #4d5049;
      font-size: clamp(1rem, 1.5vw, 1.18rem);
    }

    .primary-btn,
    .tool-btn {
      border: 1.5px solid var(--ink);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 180ms var(--ease), box-shadow 180ms var(--ease), background 180ms ease;
    }

    .primary-btn {
      display: flex;
      width: 100%;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 16px 24px;
      color: var(--ink);
      border-radius: 2px;
      background: var(--acid);
      box-shadow: 6px 6px 0 var(--ink);
      font-size: 1.08rem;
      font-weight: 900;
    }

    .button-icon {
      display: grid;
      width: 42px;
      height: 42px;
      flex: none;
      place-items: center;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--white);
    }

    .primary-btn svg { width: 20px; height: 20px; }
    .primary-btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 9px 9px 0 var(--ink); background: #e7ff91; }
    .primary-btn:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--ink); }
    .primary-btn:disabled { cursor: wait; opacity: .72; box-shadow: 3px 3px 0 var(--ink); }
    :focus-visible { outline: 3px solid #5c47e8; outline-offset: 4px; }

    .draw-stage {
      position: relative;
      margin-top: clamp(44px, 7vw, 86px);
      border: 1.5px solid var(--ink);
      background: var(--ink);
      color: var(--white);
      box-shadow: 0 10px 0 rgba(21, 23, 17, .12);
      isolation: isolate;
    }

    .draw-stage::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      opacity: .07;
      background-image:
        linear-gradient(rgba(255,255,255,.55) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.55) 1px, transparent 1px);
      background-size: 36px 36px;
      content: "";
    }

    .stage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 62px;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255,255,255,.18);
    }

    .stage-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .78rem;
      font-weight: 850;
      letter-spacing: .14em;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--acid);
      box-shadow: 0 0 0 5px rgba(223,255,104,.12);
    }

    .stage-status {
      color: rgba(255,255,255,.58);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .72rem;
      letter-spacing: .08em;
    }

    .stage-body {
      display: grid;
      grid-template-columns: minmax(230px, .72fr) minmax(0, 1.28fr);
      min-height: 430px;
    }

    .stage-message {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(28px, 4vw, 52px);
      border-right: 1px solid rgba(255,255,255,.18);
    }

    .stage-kicker {
      margin: 0;
      color: var(--acid);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .78rem;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .stage-message h2 {
      max-width: 400px;
      margin: 24px 0;
      font-size: clamp(2rem, 4vw, 4.2rem);
      line-height: .96;
      letter-spacing: -.055em;
    }

    .stage-message h2 span { color: var(--lavender); }
    .stage-note { max-width: 330px; margin: 0; color: rgba(255,255,255,.62); font-size: .9rem; }
    .names-panel { display: flex; flex-direction: column; padding: clamp(20px, 3vw, 34px); }

    .names-grid {
      display: grid;
      flex: 1;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-content: center;
    }

    .name-card {
      display: flex;
      min-height: 58px;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 2px;
      background: rgba(255,255,255,.05);
      transition: transform 220ms var(--ease), background 220ms ease, border-color 220ms ease, opacity 220ms ease;
    }

    .name-card .seed {
      color: rgba(255,255,255,.45);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .72rem;
      font-variant-numeric: tabular-nums;
    }

    .name-card strong { font-size: 1.05rem; letter-spacing: .04em; }
    .draw-stage.is-shuffling .live-dot { animation: pulse 480ms ease-in-out infinite alternate; }
    .draw-stage.is-shuffling .name-card { border-color: rgba(223,255,104,.58); background: rgba(223,255,104,.1); }
    .draw-stage.is-shuffling .names-grid { animation: stageFlicker 190ms steps(2, end) infinite; }

    .result-section { display: none; margin-top: clamp(52px, 8vw, 96px); }
    .result-section.is-visible { display: block; animation: revealSection 520ms var(--ease) both; }

    .result-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .result-header h2 {
      margin: 0;
      font-size: clamp(2.4rem, 5vw, 5rem);
      line-height: .95;
      letter-spacing: -.055em;
    }

    .result-meta {
      margin: 10px 0 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .76rem;
    }

    .result-tools { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

    .tool-btn {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      gap: 9px;
      padding: 10px 15px;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font-size: .84rem;
      font-weight: 800;
    }

    .tool-btn svg { width: 17px; height: 17px; }
    .tool-btn:hover { background: var(--white); transform: translateY(-2px); box-shadow: 0 5px 0 rgba(21,23,17,.12); }
    .tool-btn:active { transform: translateY(1px); box-shadow: none; }

    .ranking-list { margin: 0; padding: 0; border-top: 1.5px solid var(--ink); list-style: none; }

    .rank-item {
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr) auto;
      align-items: center;
      min-height: 86px;
      border-bottom: 1px solid var(--line);
      opacity: 0;
      transform: translateY(18px);
    }

    .result-section.is-visible .rank-item {
      animation: rankIn 420ms var(--ease) forwards;
      animation-delay: calc(var(--i) * 65ms + 150ms);
    }

    .rank-number {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .84rem;
    }

    .rank-name { font-size: clamp(1.25rem, 2vw, 1.65rem); font-weight: 850; letter-spacing: .04em; }
    .rank-badge { padding: 6px 10px; border: 1px solid var(--ink); border-radius: 999px; font-size: .7rem; font-weight: 850; letter-spacing: .08em; }
    .rank-item:nth-child(1) .rank-name { font-size: clamp(1.55rem, 3vw, 2.3rem); }
    .rank-item:nth-child(1) .rank-badge { background: var(--acid); }
    .rank-item:nth-child(2) .rank-badge { background: var(--lavender); }
    .rank-item:nth-child(3) .rank-badge { background: var(--coral); }

    .toast {
      position: fixed;
      z-index: 50;
      right: 20px;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 40px);
      padding: 13px 16px;
      border: 1.5px solid var(--ink);
      background: var(--acid);
      box-shadow: 5px 5px 0 var(--ink);
      font-size: .86rem;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px);
      transition: opacity 220ms ease, transform 220ms var(--ease);
    }

    .toast.is-visible { opacity: 1; transform: translateY(0); }
    .toast svg { width: 18px; height: 18px; }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 54px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .05em;
    }

    @keyframes pulse {
      to { transform: scale(1.5); box-shadow: 0 0 0 9px rgba(223,255,104,.07); }
    }
    @keyframes stageFlicker {
      50% { opacity: .72; transform: translateX(2px); }
    }
    @keyframes revealSection {
      from { opacity: 0; transform: translateY(26px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes rankIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; align-items: start; }
      .hero-actions { max-width: 560px; }
      .stage-body { grid-template-columns: 1fr; }
      .stage-message { min-height: 270px; border-right: 0; border-bottom: 1px solid rgba(255,255,255,.18); }
      .names-panel { min-height: 330px; }
    }

    @media (max-width: 600px) {
      .page-shell { width: min(100% - 24px, 1180px); padding-top: 12px; }
      .topbar { min-height: 50px; }
      .brand { font-size: .78rem; }
      h1 { font-size: clamp(3.15rem, 18vw, 5.2rem); }
      .stage-head { align-items: flex-start; flex-direction: column; gap: 5px; }
      .names-grid { grid-template-columns: 1fr; padding: 10px 0; }
      .name-card { min-height: 52px; }
      .result-header { align-items: flex-start; flex-direction: column; }
      .result-tools { justify-content: flex-start; }
      .rank-item { grid-template-columns: 54px minmax(0, 1fr) auto; min-height: 76px; }
      .rank-badge { padding: 5px 8px; font-size: .64rem; }
      .footer { flex-direction: column; gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media print {
      body { background: #fff; }
      .topbar, .hero, .draw-stage, .result-tools, .footer, .toast { display: none !important; }
      .page-shell, main { width: 100%; padding: 0; }
      .result-section { display: block !important; margin: 0; }
      .rank-item { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </span>
        報告順序抽籤所
      </div>
      <div class="student-count">10 位同學已就緒</div>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Presentation lottery · 2026</p>
          <h1 id="page-title">下一位<br>換<span class="highlight">誰上場？</span></h1>
        </div>
        <div class="hero-actions">
          <p class="intro">十位同學，一次公平的隨機排序。按下按鈕，讓緊張感交給動畫，把報告順序交給機會。</p>
          <button class="primary-btn" id="drawButton" type="button">
            <span id="drawButtonText">開獎時刻</span>
            <span class="button-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14M13 6l6 6-6 6"/>
              </svg>
            </span>
          </button>
        </div>
      </section>

      <section class="draw-stage" id="drawStage" aria-labelledby="stage-heading">
        <div class="stage-head">
          <div class="stage-title">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="stage-heading">DRAW MACHINE / 抽籤機</span>
          </div>
          <div class="stage-status" id="stageStatus">SYSTEM READY · 10/10</div>
        </div>
        <div class="stage-body">
          <div class="stage-message">
            <p class="stage-kicker" id="stageKicker">Waiting for your signal</p>
            <h2 id="stageMessage">名單就緒，<br><span>命運待機。</span></h2>
            <p class="stage-note" id="stageNote">每次按下「開獎時刻」都會重新產生一組全新的隨機順序。</p>
          </div>
          <div class="names-panel">
            <div class="names-grid" id="namesGrid" aria-label="參加抽籤的同學名單"></div>
          </div>
        </div>
      </section>

      <section class="result-section" id="resultSection" aria-labelledby="result-heading">
        <div class="result-header">
          <div>
            <p class="eyebrow">Final order</p>
            <h2 id="result-heading">報告順序</h2>
            <p class="result-meta" id="resultMeta"></p>
          </div>
          <div class="result-tools">
            <button class="tool-btn" id="copyButton" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              複製結果
            </button>
            <button class="tool-btn" id="downloadButton" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
              下載 CSV
            </button>
            <button class="tool-btn" id="printButton" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              列印
            </button>
          </div>
        </div>
        <ol class="ranking-list" id="rankingList"></ol>
      </section>
    </main>

    <footer class="footer">
      <span>RANDOM ORDER GENERATOR</span>
      <span>公平隨機 · 每次結果皆不同</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
    <span id="toastText">結果已複製</span>
  </div>

  <script>
    const students = [
      "鍾莫同", "吳宇傑", "林吟珊", "李易馨", "鄭梅芳",
      "盧巧妮", "邵曉潔", "謝岱凌", "陳思婷", "楊沛翎"
    ];

    const drawButton = document.querySelector("#drawButton");
    const drawButtonText = document.querySelector("#drawButtonText");
    const drawStage = document.querySelector("#drawStage");
    const stageStatus = document.querySelector("#stageStatus");
    const stageKicker = document.querySelector("#stageKicker");
    const stageMessage = document.querySelector("#stageMessage");
    const stageNote = document.querySelector("#stageNote");
    const namesGrid = document.querySelector("#namesGrid");
    const resultSection = document.querySelector("#resultSection");
    const resultMeta = document.querySelector("#resultMeta");
    const rankingList = document.querySelector("#rankingList");
    const toast = document.querySelector("#toast");
    const toastText = document.querySelector("#toastText");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    let finalOrder = [];
    let toastTimer;
    let isDrawing = false;

    function secureRandomInt(max) {
      if (!window.crypto || !window.crypto.getRandomValues) {
        return Math.floor(Math.random() * max);
      }
      const limit = Math.floor(0x100000000 / max) * max;
      const values = new Uint32Array(1);
      do {
        window.crypto.getRandomValues(values);
      } while (values[0] >= limit);
      return values[0] % max;
    }

    function shuffle(list) {
      const shuffled = [...list];
      for (let i = shuffled.length - 1; i > 0; i -= 1) {
        const j = secureRandomInt(i + 1);
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function renderNames(list) {
      namesGrid.innerHTML = list.map(function (name, index) {
        return '<div class="name-card"><span class="seed">' +
          String(index + 1).padStart(2, "0") +
          '</span><strong>' + name + '</strong></div>';
      }).join("");
    }

    function renderResult(list) {
      const badges = ["FIRST", "SECOND", "THIRD"];
      rankingList.innerHTML = list.map(function (name, index) {
        const badge = index < 3
          ? '<span class="rank-badge">' + badges[index] + '</span>'
          : "<span></span>";
        return '<li class="rank-item" style="--i:' + index + '">' +
          '<span class="rank-number">' + String(index + 1).padStart(2, "0") + '</span>' +
          '<span class="rank-name">' + name + '</span>' + badge + '</li>';
      }).join("");

      resultMeta.textContent = "DRAW ID " + createDrawId() + " · " + formatTime(new Date());
      resultSection.classList.remove("is-visible");
      void resultSection.offsetWidth;
      resultSection.classList.add("is-visible");
    }

    function createDrawId() {
      const bytes = new Uint16Array(2);
      if (window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(bytes);
      } else {
        bytes[0] = Math.random() * 65536;
        bytes[1] = Math.random() * 65536;
      }
      return Array.from(bytes, function (value) {
        return value.toString(16).padStart(4, "0");
      }).join("").toUpperCase();
    }

    function formatTime(date) {
      return new Intl.DateTimeFormat("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(date);
    }

    function delay(ms) {
      return new Promise(function (resolve) {
        window.setTimeout(resolve, ms);
      });
    }

    async function startDraw() {
      if (isDrawing) return;
      isDrawing = true;
      drawButton.disabled = true;
      drawButtonText.textContent = "隨機排序中…";
      resultSection.classList.remove("is-visible");
      drawStage.classList.add("is-shuffling");
      stageStatus.textContent = "SHUFFLING · RANDOMIZING";
      stageKicker.textContent = "Random sequence in progress";
      stageMessage.innerHTML = "順序洗牌中，<br><span>請稍候…</span>";
      stageNote.textContent = "系統正在重新排列所有姓名，每一位同學都會出現一次。";

      finalOrder = shuffle(students);

      if (!reduceMotion.matches) {
        for (let round = 0; round < 18; round += 1) {
          renderNames(shuffle(students));
          await delay(85 + round * 3);
        }
      } else {
        await delay(250);
      }

      renderNames(finalOrder);
      drawStage.classList.remove("is-shuffling");
      stageStatus.textContent = "DRAW COMPLETE · 10/10";
      stageKicker.textContent = "Sequence confirmed";
      stageMessage.innerHTML = "結果揭曉，<br><span>順序確定。</span>";
      stageNote.textContent = "完整排序已產生。你可以複製、下載 CSV，或直接列印結果。";
      renderResult(finalOrder);

      drawButtonText.textContent = "再抽一次";
      drawButton.disabled = false;
      isDrawing = false;

      await delay(reduceMotion.matches ? 0 : 150);
      resultSection.scrollIntoView({
        behavior: reduceMotion.matches ? "auto" : "smooth",
        block: "start"
      });
    }

    function resultAsText() {
      return [
        "報告順序抽籤結果",
        "產生時間：" + formatTime(new Date()),
        ""
      ].concat(finalOrder.map(function (name, index) {
        return (index + 1) + ". " + name;
      })).join("\n");
    }

    function showToast(message) {
      toastText.textContent = message;
      toast.classList.add("is-visible");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(function () {
        toast.classList.remove("is-visible");
      }, 2800);
    }

    async function copyResult() {
      if (!finalOrder.length) return;
      try {
        await navigator.clipboard.writeText(resultAsText());
        showToast("結果已複製到剪貼簿");
      } catch (error) {
        const textArea = document.createElement("textarea");
        textArea.value = resultAsText();
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        textArea.remove();
        showToast("結果已複製到剪貼簿");
      }
    }

    function downloadCsv() {
      if (!finalOrder.length) return;
      const rows = ["順序,姓名"].concat(finalOrder.map(function (name, index) {
        return (index + 1) + "," + name;
      }));
      const blob = new Blob(["\uFEFF" + rows.join("\r\n")], {
        type: "text/csv;charset=utf-8"
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "報告順序_" + new Date().toISOString().slice(0, 10) + ".csv";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("CSV 檔案已下載");
    }

    drawButton.addEventListener("click", startDraw);
    document.querySelector("#copyButton").addEventListener("click", copyResult);
    document.querySelector("#downloadButton").addEventListener("click", downloadCsv);
    document.querySelector("#printButton").addEventListener("click", function () {
      window.print();
    });

    renderNames(students);
  </script>
</body>
</html>
